    <h1>Решение алгоритмической задачи</h1>
    <h2>Задача №1013</h2>

    <form id="task-form" action="https://httpbin.org/post"
          method="post" target="_blank">
        <p>
            <label for="formulation">Условие задачи:</label><br>
            <textarea id="formulation" name="formulation"
                      rows="4" cols="50" readonly>№1013. Даны вещественные числа X и Y. Вычислить Z: Z = X * Y при X > Y, иначе Z = ln(X + Y).</textarea>
        </p>

        <p>
            <label for="x">X:</label>
            <input id="x" name="x" type="number"
                   step="any" value="3" required>
        </p>

        <p>
            <label for="y">Y:</label>
            <input id="y" name="y" type="number"
                   step="any" value="2" required>
        </p>

        <p>
            <label for="z">Результат Z:</label>
            <input id="z" name="z" type="text" readonly>
        </p>

        <p id="message" role="status" aria-live="polite"></p>

        <button id="calculate" type="button">Вычислить</button>
        <button id="send" type="submit" disabled>
            Отправить условие, данные и результат
        </button>
    </form>

    <script>
        const form = document.getElementById('task-form');
        const xInput = document.getElementById('x');
        const yInput = document.getElementById('y');
        const result = document.getElementById('z');
        const message = document.getElementById('message');
        const sendButton = document.getElementById('send');

        function calculate() {
            result.value = '';
            message.textContent = '';
            sendButton.disabled = true;

            if (!form.reportValidity()) {
                return false;
            }

            const x = xInput.valueAsNumber;
            const y = yInput.valueAsNumber;

            if (!Number.isFinite(x) || !Number.isFinite(y)) {
                message.textContent = 'Введите два конечных числа.';
                return false;
            }

            let z;

            if (x > y) {
                z = x * y;
            } else {
                if (x + y <= 0) {
                    message.textContent =
                        'Ошибка: для логарифма X + Y должно быть больше нуля.';
                    return false;
                }

                z = Math.log(x + y);
            }

            if (!Number.isFinite(z)) {
                message.textContent =
                    'Результат слишком велик. Измените исходные числа.';
                return false;
            }

            result.value = z;
            message.textContent = 'Результат вычислен. Можно отправить данные.';
            sendButton.disabled = false;
            return true;
        }

        document.getElementById('calculate')
            .addEventListener('click', calculate);

        form.addEventListener('submit', function (event) {
            if (!calculate()) {
                event.preventDefault();
            }
        });

        form.addEventListener('input', function () {
            result.value = '';
            message.textContent = 'Данные изменились. Нажмите «Вычислить».';
            sendButton.disabled = true;
        });
    </script>
</body>
